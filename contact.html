<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>UnityUnits</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/png" href="./images/boxes.png" />
    <link rel="apple-touch-icon" href="./images/boxes.png" />
    <link rel="webmanifest" href="./manifest.json" />
</head>
<body>
    <div id="page">
        <div id="body">
            <div id="header" class="container">
                <h2><a href="./index.html">Die praktische Kiste</a></h2>
            </div>
            <div id="container-contact" class="container">
                <form>
                    <h3>Kontakt</h3>
                    <label for="name">Name:</label> <br>
                    <input type="text" id="name" name="name" required /> <br>
                     <br>
                    <label for="email">E-Mail:</label> <br>
                    <input type="email" id="email" name="email" required /> <br>
                     <br>
                    <label for="message">Nachricht:</label> <br>
                    <textarea id="message" name="message" rows="4" required></textarea> <br>
                     <br>
                    <button type="submit">Absenden</button> <br>
                    <p>Wir werden uns so schnell wie möglich bei Ihnen melden.</p>                </form>
            </div>
            <div id="footer" class="container">
                <p>© 2025 UnityUnits - Alle Rechte vorbehalten.</p> 
                <nav id="navigation" class="container">
                    <ul>
                        <a href="./imprint.html">Impressum</a>
                        <a href="./privacy.html">Datenschutz</a>
                        <a href="./contact.html">Kontakt</a>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
